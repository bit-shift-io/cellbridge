<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Soft Purple Material Gradient -->
    <radialGradient id="purple-bg-gradient" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </radialGradient>

    <!-- Material Elevation Drop Shadow -->
    <filter id="m3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B0764" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3B0764" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- Circular Container with Soft Purple Gradient -->
  <circle cx="24" cy="24" r="21" fill="url(#purple-bg-gradient)" filter="url(#m3-shadow)" />

  <!-- Router Group -->
  <g transform="translate(24, 25) scale(1.25) translate(-24, -24)">
    <!-- Base Shadow Accent Layer -->
    <path d="M14 31h20c1.1 0 2 .9 2 2v1c0 1.1-.9 2-2 2H14c-1.1 0-2-.9-2-2v-1c0-1.1.9-2 2-2z" fill="#4C1D95" opacity="0.35" />

    <!-- Antennas -->
    <g fill="#DDD6FE">
      <rect x="17" y="11" width="2.5" height="13" rx="1.25" />
      <rect x="22.75" y="9" width="2.5" height="15" rx="1.25" />
      <rect x="28.5" y="11" width="2.5" height="13" rx="1.25" />
    </g>

    <!-- Router Main Body -->
    <rect x="11" y="21" width="26" height="11" rx="3.5" fill="#FFFFFF" />

    <!-- Top Bezel Highlight/Reflection -->
    <path d="M14.5 21h19c1.93 0 3.5 1.57 3.5 3.5v1H11v-1c0-1.93 1.57-3.5 3.5-3.5z" fill="#F5F3FF" opacity="0.85" />

    <!-- LED Status Indicators -->
    <circle cx="15.5" cy="26.5" r="1.1" fill="#34D399" />
    <circle cx="19.5" cy="26.5" r="1.1" fill="#34D399" />
    <circle cx="23.5" cy="26.5" r="1.1" fill="#818CF8" />

    <!-- Signal Wave Accents -->
    <path d="M29.5 26a2.2 2.2 0 0 1 3.2 0" stroke="#A78BFA" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <path d="M28.3 24.5a4 4 0 0 1 5.6 0" stroke="#C4B5FD" stroke-width="1.3" stroke-linecap="round" fill="none" />
  </g>
</svg>