[package]
name = "cellbridge"
version = "0.1.0"
edition = "2024"

[lib]
# `rlib` lets the external integration tests in `tests/` link the crate; the
# `cdylib`/`staticlib` outputs remain what Flutter and the platform build use.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "0.22.1"
boringtun = "0.7.1"
bytes = "1.12.1"
flutter_rust_bridge = "=2.13.0"
getrandom = "0.2.17"
smoltcp = "0.14.0"
socket2 = "0.6.5"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa"] }

[dev-dependencies]
rand = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
