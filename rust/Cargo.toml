[package]
name = "cellbridge"
version = "0.1.0"
edition = "2024"

[lib]
# `rlib` lets the external integration tests in `tests/` link the crate; the
# `cdylib`/`staticlib` outputs remain what Flutter and the platform build use.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "0.22.1"
boringtun = "0.7.1"
bytes = "1.12.1"
flutter_rust_bridge = "=2.13.0"
getrandom = "0.2.17"
smoltcp = "0.14.0"
socket2 = "0.6.5"
tokio = { version = "1.54.0", features = ["macros", "rt", "net", "io-util", "time", "sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
